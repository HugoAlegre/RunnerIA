<div class="cliente-field password-field">
  @if (label) {
    <label>{{ label }}</label>
  }
  <div class="pass-wrap">
    <input
      [type]="visible ? 'text' : 'password'"
      [ngModel]="value"
      (ngModelChange)="onInput($event)"
      [autocomplete]="autocomplete"
      [placeholder]="placeholder"
      [name]="name || 'password'"
      (keyup.enter)="enter.emit()"
    />
    @if (holdToReveal) {
      <button
        type="button"
        class="pass-toggle pass-eye"
        [attr.title]="visible ? 'Soltá para ocultar' : 'Mantené presionado para ver'"
        [attr.aria-label]="visible ? 'Soltá para ocultar' : 'Mantené presionado para ver'"
        [attr.aria-pressed]="visible"
        (pointerdown)="mostrar()"
        (pointerup)="ocultar()"
        (pointerleave)="ocultar()"
        (pointercancel)="ocultar()"
        (keydown)="onTeclaMostrar($event)"
        (keyup)="ocultar()"
        (blur)="ocultar()"
      >
        @if (visible) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M17.9 17.9A10.4 10.4 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 5.1-6.1"/>
            <path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.3"/>
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
            <line x1="2" y1="2" x2="22" y2="22"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M2 12s3-8 10-8 10 8 10 8-3 8-10 8-10-8-10-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    } @else {
      <button type="button" class="pass-toggle" (click)="toggle()">
        {{ visible ? 'Ocultar' : 'Ver' }}
      </button>
    }
  </div>
  @if (hint) {
    <span class="hint" [class.set]="hintSet">{{ hint }}</span>
  }
  @if (warnHint) {
    <span class="hint warn-hint">{{ warnHint }}</span>
  }
</div>
